name: Validate playbooks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate playbooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry, skills, and local links
        run: python3 scripts/validate.py
      - name: Test validation failures
        run: python3 -m unittest discover -s tests -v
      - name: Install YAML parser for the release audit fixtures
        run: python3 -m pip install -r skills/release-pending-audit/requirements.txt
      - name: Test release audit against local Git fixtures
        run: python3 -B -m unittest discover -s skills/release-pending-audit/tests -v
